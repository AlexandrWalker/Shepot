<div id="age-verification-popup" class="popup-age" style="display: none;">
  <div class="popup-age__wrap">
    <div class="popup-age__title gradient-text">
      Вам уже исполнилось <br> 18&nbsp;лет?
    </div>
    <div class="popup-age__text">
      Для доступа на сайт вы должны подтвердить свой совершеннолетний возраст. Сайт содержит
      информацию об алкогольной продукции, которая не предназначена для лиц младше 18 лет.
    </div>
    <div class="popup-age__actions">
      <button id="age-verify-fail" class="btn btn--outline">
        <div class="btn__text">
          Нет
        </div>
      </button>
      <button id="age-verify-success" class="btn btn--gold-gradient">
        <div class="btn__text">
          Да
        </div>
      </button>
    </div>
  </div>
</div>
